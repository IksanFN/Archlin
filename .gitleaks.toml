[extend]
useDefault = true

# Local development and test credentials only: they protect throwaway databases on 127.0.0.1.
[[allowlists]]
description = "Dev and E2E credentials"
paths = [
  '''apps/web/e2e/\.env\.e2e''',
  '''apps/web/e2e/\.env\.e2e-runner''',
  '''docker/compose\.dev\.yml''',
  '''scripts/generate-env\.mjs''',
]
